<div class="login-container">
    <div class="login-card">

            <img src="assets/user.png" alt="User">
            <h1>ورود به سیستم</h1>
        </div>

        <form>
            <div class="form-group">
                <img src="assets/email.png" alt="Email">
                <input type="email" placeholder="ایمیل شما" id="email">
            </div>

            <div class="form-group">
                <img src="assets/password.png" alt="Password">
                <input type="password" placeholder="رمز عبور شما" id="password">
            </div>
        </form>

        <button class="enetr-btn">ورود</button>
    </div>
</div>
